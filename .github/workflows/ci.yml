name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Validate localization and Python scoping
        env:
          PYTHONUTF8: "1"
        run: python scripts/validate_locales.py

      # One process per file: a single pytest process can hang on a modal dialog.
      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: .\scripts\run_tests_by_file.ps1 -Python python
